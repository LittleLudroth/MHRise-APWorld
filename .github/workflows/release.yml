name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify tag, archipelago.json, and client versions all match
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          json_version="$(python -c "import json; print(json.load(open('ap_world/archipelago.json'))['world_version'])")"
          lua_version="$(python -c "import re; print(re.search(r'APWORLD_VERSION\s*=\s*\"([^\"]+)\"', open('client/MHRiseAP.lua').read()).group(1))")"
          echo "Git tag version:        $tag_version"
          echo "archipelago.json:       $json_version"
          echo "client/MHRiseAP.lua:    $lua_version"
          if [ "$tag_version" != "$json_version" ] || [ "$tag_version" != "$lua_version" ]; then
            echo "::error::Version drift. tag=$tag_version json=$json_version lua=$lua_version. All three must match — bump archipelago.json world_version and client/MHRiseAP.lua APWORLD_VERSION before tagging."
            exit 1
          fi

      - name: Verify archipelago.json has compatible_version (APContainer schema int)
        run: |
          python <<'PY'
          import json, sys
          cv = json.load(open('ap_world/archipelago.json')).get('compatible_version')
          if not isinstance(cv, int):
              print("::error::archipelago.json missing 'compatible_version' (int APContainer schema version, not semver). Expected: 7.")
              sys.exit(1)
          PY

      - name: Build mhrise.apworld
        run: python ap_world/build_apworld.py

      - name: Build mhrise-client.zip
        run: |
          python <<'PY'
          import zipfile
          from pathlib import Path

          # Explicit allow-list. Top-level files land at the game install
          # root; reframework/ files land under reframework/autorun/.
          ROOT_FILES = [
              "client/lua-apclientpp.dll",
              "client/lua-apclientpp-license.txt",
          ]
          AUTORUN_FILES = [
              "client/MHRiseAP.lua",
              "client/AP_REF/core.lua",
              "client/AP_CLIENT/Items.lua",
              "client/AP_CLIENT/Lookups.lua",
              "client/AP_CLIENT/Monsters.lua",
              "client/AP_CLIENT/Quests.lua",
              "client/AP_CLIENT/Session.lua",
              "client/AP_CLIENT/Tracker.lua",
              "client/AP_CLIENT/Weapons.lua",
              "client/AP_CLIENT/Deathlink.lua",
              "client/AP_CLIENT/Utilities.lua"
          ]

          out = Path("mhrise-client.zip")
          if out.exists():
              out.unlink()

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              for src in ROOT_FILES:
                  p = Path(src)
                  if not p.is_file():
                      raise SystemExit(f"missing required file: {src}")
                  zf.write(p, p.name)
              for src in AUTORUN_FILES:
                  p = Path(src)
                  if not p.is_file():
                      raise SystemExit(f"missing required file: {src}")
                  arcname = "reframework/autorun/" + str(p.relative_to("client")).replace("\\", "/")
                  zf.write(p, arcname)

          print("Wrote", out)
          for n in zipfile.ZipFile(out).namelist():
              print("  ", n)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            mhrise.apworld
            mhrise-client.zip
